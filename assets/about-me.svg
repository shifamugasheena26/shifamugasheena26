<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000" height="650" viewBox="0 0 1000 650">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#190B12"/>
      <stop offset="55%" stop-color="#10070C"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5B5C7"/>
      <stop offset="50%" stop-color="#701A3D"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451126" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#190B12" stop-opacity=".95"/>
    </linearGradient>

    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35" fill="none"
            stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>

    <clipPath id="photoClip">
      <circle cx="500" cy="310" r="100"/>
    </clipPath>

    <style>
      .heading {
        font-family: Arial, sans-serif;
        font-size: 30px;
        font-weight: bold;
        letter-spacing: 5px;
        fill: #F8F0F3;
      }

      .name {
        font-family: Arial, sans-serif;
        font-size: 22px;
        font-weight: bold;
        fill: #E5B5C7;
      }

      .label {
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 2px;
        fill: #C77B9B;
      }

      .description {
        font-family: Arial, sans-serif;
        font-size: 12px;
        fill: #F8F0F3;
      }

      .card {
        fill: url(#card);
        stroke: #701A3D;
        stroke-width: 1.2;
        transition: stroke .3s ease;
      }

      .clickable {
        cursor: pointer;
        text-decoration: none;
      }

      .clickable:hover .card {
        stroke: #E5B5C7;
        stroke-width: 2.5;
      }

      @keyframes rotate {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      .orbit {
        transform-origin: 500px 310px;
        animation: rotate 25s linear infinite;
      }

      .pulse {
        animation: pulse 3s ease-in-out infinite;
      }

      .left-card {
        animation: float 5s ease-in-out infinite;
      }

      .right-card {
        animation: float 5s ease-in-out 1.5s infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="650" rx="20" fill="url(#grid)"/>

  <circle cx="500" cy="310" r="280" fill="url(#glow)"/>

  <!-- Heading -->
  <text x="500" y="65" text-anchor="middle" class="heading">
    ABOUT ME
  </text>

  <rect x="445" y="82" width="110" height="3" rx="2"
        fill="url(#ring)"/>

  <text x="500" y="108" text-anchor="middle"
        class="label">A LITTLE INTRODUCTION</text>

  <!-- Connecting lines -->
  <g fill="none" stroke="#C77B9B"
     stroke-opacity=".55" stroke-width="1.3">
    <path d="M390 245 L330 210 L290 210"/>
    <path d="M610 245 L670 210 L710 210"/>
    <path d="M390 390 L330 445 L290 445"/>
    <path d="M610 390 L670 445 L710 445"/>
  </g>

  <!-- Center orbit -->
  <circle cx="500" cy="310" r="135"
          fill="none" stroke="#701A3D"
          stroke-width="1.5" stroke-dasharray="5 8"/>

  <circle cx="500" cy="310" r="120"
          fill="none" stroke="url(#ring)"
          stroke-width="2" stroke-dasharray="100 25"
          class="orbit"/>

  <circle cx="500" cy="175" r="5"
          fill="#E5B5C7" class="pulse"/>

  <circle cx="635" cy="310" r="5"
          fill="#C77B9B" class="pulse"/>

  <!-- Photo frame -->
  <circle cx="500" cy="310" r="108"
          fill="#451126" stroke="#C77B9B" stroke-width="2"/>

  <circle cx="500" cy="310" r="103"
          fill="none" stroke="#E5B5C7"
          stroke-width="1" stroke-opacity=".6"/>

  <!-- Photo placeholder -->
  <!-- My Photo -->
<image
  xlink:href="https://raw.githubusercontent.com/shifamugasheena26/shifamugasheena26/main/assets/shifa-photo.jpg"
  x="400"
  y="210"
  width="200"
  height="200"
  preserveAspectRatio="xMidYMid slice"
  clip-path="url(#photoClip)"
/>

  <!-- Name -->
  <text x="500" y="465" text-anchor="middle" class="name">
    SHIFA MUGASHEENA
  </text>

  <text x="500" y="488" text-anchor="middle"
        class="label">ASPIRING SOFTWARE DEVELOPER</text>

  <!-- Clickable Box 1 -->
  <a class="clickable" target="_blank"
     xlink:href="https://github.com/shifamugasheena26"
     href="https://github.com/shifamugasheena26">

    <g class="left-card">
      <rect x="65" y="155" width="270" height="110"
            rx="15" class="card"/>

      <text x="90" y="185" class="label">01 / INTRODUCTION</text>

      <text x="90" y="215" class="description">
        BCA Graduate
      </text>

      <text x="90" y="237" class="description">
        Interested in software development.
      </text>
    </g>
  </a>

  <!-- Clickable Box 2 -->
  <a class="clickable" target="_blank"
     xlink:href="https://github.com/shifamugasheena26?tab=repositories"
     href="https://github.com/shifamugasheena26?tab=repositories">

    <g class="right-card">
      <rect x="665" y="155" width="270" height="110"
            rx="15" class="card"/>

      <text x="690" y="185" class="label">02 / MY INTERESTS</text>

      <text x="690" y="215" class="description">
        Web Development
      </text>

      <text x="690" y="237" class="description">
        Problem Solving &amp; Coding.
      </text>
    </g>
  </a>

  <!-- Clickable Box 3 -->
  <a class="clickable" target="_blank"
     xlink:href="https://github.com/shifamugasheena26/Full-Stack-Learning"
     href="https://github.com/shifamugasheena26/Full-Stack-Learning">

    <g class="left-card">
      <rect x="65" y="395" width="270" height="110"
            rx="15" class="card"/>

      <text x="90" y="425" class="label">03 / CURRENTLY LEARNING</text>

      <text x="90" y="455" class="description">
        JavaScript &amp; MERN Stack
      </text>

      <text x="90" y="477" class="description">
        Improving my development skills.
      </text>
    </g>
  </a>

  <!-- Clickable Box 4 -->
  <a class="clickable" target="_blank"
     xlink:href="https://github.com/shifamugasheena26"
     href="https://github.com/shifamugasheena26">

    <g class="right-card">
      <rect x="665" y="395" width="270" height="110"
            rx="15" class="card"/>

      <text x="690" y="425" class="label">04 / MY GOAL</text>

      <text x="690" y="455" class="description">
        Become a Software Developer
      </text>

      <text x="690" y="477" class="description">
        Build useful real-world projects.
      </text>
    </g>
  </a>

  <!-- Bottom Skills -->
  <text x="500" y="550" text-anchor="middle"
        class="label">TECHNOLOGIES I'M EXPLORING</text>

  <g font-family="Arial" font-size="12"
     fill="#E5B5C7" text-anchor="middle">

    <rect x="265" y="570" width="75" height="30"
          rx="14" fill="#451126" stroke="#701A3D"/>
    <text x="302" y="590">JAVA</text>

    <rect x="350" y="570" width="115" height="30"
          rx="14" fill="#451126" stroke="#701A3D"/>
    <text x="407" y="590">JAVASCRIPT</text>

    <rect x="475" y="570" width="75" height="30"
          rx="14" fill="#451126" stroke="#701A3D"/>
    <text x="512" y="590">HTML</text>

    <rect x="560" y="570" width="75" height="30"
          rx="14" fill="#451126" stroke="#701A3D"/>
    <text x="597" y="590">CSS</text>

    <rect x="645" y="570" width="90" height="30"
          rx="14" fill="#451126" stroke="#701A3D"/>
    <text x="690" y="590">MERN</text>
  </g>

  <text x="500" y="625" text-anchor="middle"
        font-family="Arial" font-size="10"
        letter-spacing="2" fill="#8D6275">
    LEARN • BUILD • GROW
  </text>

</svg>
