<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-labelledby="footer-title">
  <title id="footer-title">Shifa Mugasheena footer</title>
  <defs>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="120" fill="url(#fbg)"/>
  <path d="M0 30 H1000" stroke="url(#fline)" stroke-width="1.5">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle r="3" fill="#E5B5C7">
    <animateMotion dur="7s" repeatCount="indefinite" path="M0 30 H1000"/>
  </circle>
  <text x="500" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" letter-spacing="5" fill="#F8F0F3">SHIFA MUGASHEENA</text>
  <text x="500" y="98" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" fill="#C77B9B">Thanks for visiting · Keep learning</text>
</svg>